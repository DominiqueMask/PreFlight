n      kids.push(c('line',{key:'w3',x1:cx-12,y1:cy+22,x2:cx+12,y2:cy+22,stroke:'#e7b83b',strokeWidth:4}));\n    } else if (fig.kind === 'vor') {\n      kids.push(face());\n      kids.push(txt(cx,24,('00'+fig.obs).slice(-3),20,'#eef2f7','obs'));\n      for (let d=-2;d<=2;d++){ if(d===0) continue; kids.push(c('circle',{key:'d'+d,cx:cx+d*22,cy,r:5,fill:'none',stroke:'#8b96a5',strokeWidth:2})); }\n      kids.push(c('circle',{key:'dc',cx,cy,r:7,fill:'none',stroke:'#8b96a5',strokeWidth:2}));\n      const defl=(fig.side==='R'?1:-1)*(fig.dots||0)*22;\n      kids.push(c('line',{key:'cdi',x1:cx+defl,y1:cy-58,x2:cx+defl,y2:cy+58,stroke:'#33b06a',strokeWidth:4}));\n      const to=fig.flag==='TO';\n      kids.push(c('polygon',{key:'flag',points: to?`${cx-9},${cy-34} ${cx+9},${cy-34} ${cx},${cy-46}`:`${cx-9},${cy+34} ${cx+9},${cy+34} ${cx},${cy+46}`,fill:'#e7b83b'}));\n      kids.push(txt(cx+(to?0:0), to?cy-58:cy+58, to?'':'',10,'#7f8b9a','ff'));\n    } else if (fig.kind === 'att') {\n      const clip='ac'+Math.random().toString(36).slice(2,7);\n      const bank=fig.bank||0, pitch=fig.pitch||0, sh=pitch*2.2;\n      const inner=c('g',{key:'rot',transform:`rotate(${-bank} ${cx} ${cy})`},[\n        c('rect',{key:'sky',x:cx-170,y:cy-200+sh,width:340,height:200,fill:'#3d7bd6'}),\n        c('rect',{key:'gnd',x:cx-170,y:cy+sh,width:340,height:200,fill:'#8a5a2b'}),\n        c('line',{key:'hz',x1:cx-170,y1:cy+sh,x2:cx+170,y2:cy+sh,stroke:'#ffffff',strokeWidth:2}),\n      ]);\n      kids.push(c('clipPath',{key:'cp',id:clip},c('circle',{cx,cy,r:106})));\n      kids.push(c('g',{key:'in',clipPath:`url(#${clip})`},inner));\n      kids.push(c('circle',{key:'ring',cx,cy,r:106,fill:'none',stroke:'#2b3442',strokeWidth:10}));\n      [ -60,-45,-30,-20,-10,10,20,30,45,60 ].forEach((deg,i)=>{ const [x1,y1]=P(96,deg),[x2,y2]=P(Math.abs(deg)%30===0?84:90,deg); kids.push(c('line',{key:'b'+i,x1,y1,x2,y2,stroke:'#eef2f7',strokeWidth:2})); });\n      kids.push(c('polygon',{key:'bp',points:`${cx-7},16 ${cx+7},16 ${cx},28`,fill:'#e7b83b'}));\n      kids.push(c('line',{key:'ml',x1:cx-42,y1:cy,x2:cx-14,y2:cy,stroke:'#e7b83b',strokeWidth:5}));\n      kids.push(c('line',{key:'mr',x1:cx+14,y1:cy,x2:cx+42,y2:cy,stroke:'#e7b83b',strokeWidth:5}));\n      kids.push(c('circle',{key:'md',cx,cy,r:4,fill:'#e7b83b'}));\n    }\n\n    const svg = c('svg',{viewBox:'0 0 240 240',width:'100%',height:'100%',style:{display:'block'}}, kids);\n    return c('div',{'data-om-raster':true,style:{width:200,height:200}}, svg);\n  }\n\n  // ---------- persistence ----------\n  KEY = 'preflight_pilot_v1';\n  load() {\n    let base = { xp:0, streak:0, streakDate:null, dailyXp:0, dailyDate:null, dailyGoal:60, cards:{} };\n    try {\n      const s = JSON.parse(localStorage.getItem(this.KEY));\n      if (s) base = { ...base, ...s, cards: s.cards || {} };\n    } catch(e){}\n    // reset daily counter if new day\n    if (base.dailyDate !== this.today()) { base.dailyXp = 0; base.dailyDate = this.today(); }\n    return base;\n  }\n  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.state.profile)); } catch(e){} }\n\n  today() { return new Date().toISOString().slice(0,10); }\n  yesterday() { const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }\n\n  // ---------- spaced repetition (SM-2 lite) ----------\n  cardState(id) { return this.state.profile.cards[id] || { reps:0, interval:0, ease:2.5, due:0 }; }\n  isDue(id) { const c = this.state.profile.cards[id]; return !c || c.due <= Date.now(); }\n  daysLabel(id, quality) {\n    const c = this.cardState(id);\n    const iv = this.nextInterval(c, quality);\n    if (iv < 1) return '<10 min';\n    if (iv === 1) return '1 day';\n    return Math.round(iv) + ' days';\n  }\n  nextInterval(c, quality) {\n    // quality: 0 again, 1 good, 2 easy\n    if (quality === 0) return 0.007; // ~10 min\n    if (c.reps === 0) return quality === 2 ? 3 : 1;\n    if (c.reps === 1) return quality === 2 ? 6 : 3;\n    const mult = quality === 2 ? c.ease * 1.3 : c.ease;\n    return Math.max(1, c.interval * mult);\n  }\n  schedule(id, quality) {\n    const c = this.cardState(id);\n    const iv = this.nextInterval(c, quality);\n    let ease = c.ease;\n    if (quality === 0) ease = Math.max(1.3, ease - 0.2);\n    else if (quality === 2) ease = ease + 0.15;\n    const reps = quality === 0 ? 0 : c.reps + 1;\n    this.state.profile.cards[id] = { reps, interval: iv, ease, due: Date.now() + iv*86400000, seen:true };\n  }\n\n  masteredCount(topicId) {\n    return this.ITEMS.filter(it => (!topicId || it.topic===topicId))\n      .filter(it => { const c = this.state.profile.cards[it.id]; return c && c.reps >= 2; }).length;\n  }\n  dueCount() { return this.ITEMS.filter(it => { const c = this.state.profile.cards[it.id]; return c && c.due <= Date.now(); }).length; }\n\n  // ---------- session flow ----------\n  startTopic(topicId) {\n    let pool = this.ITEMS.filter(it => it.topic === topicId);\n    // prioritise due + unseen, then rest\n    pool = this.orderPool(pool);\n    this.beginSession(pool.slice(0,8), topicId);\n  }\n  startReview = () => {\n    let due = this.ITEMS.filter(it => this.isDue(it.id) && (this.state.profile.cards[it.id] && this.state.profile.cards[it.id].seen));\n    let unseen = this.ITEMS.filter(it => !this.state.profile.cards[it.id]);\n    let pool = due.concat(unseen);\n    if (pool.length === 0) pool = this.shuffle(this.ITEMS.slice());\n    this.beginSession(this.orderPool(pool).slice(0,10), null);\n  }\n  orderPool(pool) {\n    return this.shuffle(pool.slice()).sort((a,b) => {\n      const ca = this.state.profile.cards[a.id], cb = this.state.profile.cards[b.id];\n      const da = !ca ? 1 : (ca.due <= Date.now() ? 0 : 2);\n      const db = !cb ? 1 : (cb.due <= Date.now() ? 0 : 2);\n      return da - db;\n    });\n  }\n  shuffle(a) { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\n\n  beginSession(queue, topicId) {\n    if (!queue.length) return;\n    this.setState({ view:'session', session:{ queue, index:0, xp:0, correct:0, graded:0, flipped:false, selected:null, answered:false, topicId } });\n  }\n\n  cur() { const s = this.state.session; return s ? s.queue[s.index] : null; }\n\n  flipCard = () => { if (!this.state.session.flipped) this.setState({ session:{ ...this.state.session, flipped:true } }); }\n\n  rate = (quality) => {\n    const it = this.cur();\n    this.schedule(it.id, quality);\n    const gain = 10 + (quality>=1 ? 5 : 0) + (quality===2 ? 3 : 0);\n    const s = this.state.session;\n    this.advance({ xp:s.xp+gain, correct:s.correct + (quality>=1?1:0), graded:s.graded+1 });\n  }\n  rateAgain = () => this.rate(0);\n  rateGood  = () => this.rate(1);\n  rateEasy  = () => this.rate(2);\n\n  pick = (i) => {\n    const s = this.state.session;\n    if (s.answered) return;\n    const it = this.cur();\n    const correct = i === it.answer;\n    this.schedule(it.id, correct ? 1 : 0);\n    this.setState({ session:{ ...s, selected:i, answered:true, correct: s.correct + (correct?1:0), graded: s.graded+1, xp: s.xp + (correct?15:5) } });\n  }\n  nextItem = () => { this.advance({}); }\n\n  advance(patch) {\n    const s = { ...this.state.session, ...patch };\n    if (s.index + 1 >= s.queue.length) {\n      this.finish(s);\n    } else {\n      this.setState({ session:{ ...s, index:s.index+1, flipped:false, selected:null, answered:false } });\n    }\n  }\n\n  finish(s) {\n    const p = this.state.profile;\n    p.xp += s.xp;\n    p.dailyXp = (p.dailyDate===this.today()? p.dailyXp:0) + s.xp;\n    p.dailyDate = this.today();\n    // streak\n    if (p.streakDate === this.today()) { /* already counted */ }\n    else if (p.streakDate === this.yesterday()) p.streak += 1;\n    else p.streak = 1;\n    p.streakDate = this.today();\n    this.save();\n    this.setState({ view:'results', profile:p, session:{ ...s, done:true } });\n  }\n\n  quitSession = () => { this.save(); this.setState({ view:'home', session:null }); }\n  goHome = () => { this.setState({ view:'home', session:null }); }\n\n  // ---------- render ----------\n  renderVals() {\n    const p = this.state.profile;\n    const view = this.state.view;\n    const level = Math.floor(p.xp / 150) + 1;\n    const ranks = ['Ground School','Student Pilot','First Solo','Cross-Country','Checkride Ready','Private Pilot','Instrument Bound','Commercial Track','ATP Class'];\n    const rankName = ranks[Math.min(level-1, ranks.length-1)];\n    const xpToNext = level*150 - p.xp;\n\n    const ringCirc = 2 * Math.PI * 42;\n    const goalPct = Math.min(1, p.dailyXp / p.dailyGoal);\n    const ringOffset = ringCirc * (1 - goalPct);\n\n    const due = this.dueCount();\n    const unseen = this.ITEMS.filter(it => !p.cards[it.id]).length;\n    const reviewSubtitle = due > 0\n      ? due + ' card' + (due>1?'s':'') + ' due now' + (unseen? ' · ' + unseen + ' new to learn':'')\n      : (unseen ? unseen + ' new cards to learn' : 'All caught up — practice anytime');\n\n    const cardBase = 'border:none; cursor:pointer; background:#fff; border-radius:20px; padding:16px; box-shadow:0 4px 14px rgba(20,32,46,.06); transition:transform .16s, box-shadow .16s; display:block;';\n    const topics = this.TOPICS.map(t => {\n      const total = this.ITEMS.filter(it => it.topic===t.id).length;\n      const mastered = this.masteredCount(t.id);\n      const seen = this.ITEMS.filter(it => it.topic===t.id && p.cards[it.id]).length;\n      const pct = Math.round((mastered/total)*100);\n      const dueT = this.ITEMS.filter(it => it.topic===t.id && p.cards[it.id] && p.cards[it.id].due<=Date.now()).length;\n      return {\n        ...t, pct, pctStr: pct + '%',\n        cardStyle: cardBase,\n        hover: { transform:'translateY(-3px)', boxShadow:'0 12px 26px rgba(20,32,46,.12)' },\n        meta: dueT>0 ? (dueT + ' due · ' + mastered + '/' + total) : (mastered===total && total>0 ? 'Mastered ✓' : mastered + ' / ' + total + ' mastered'),\n        onClick: () => this.startTopic(t.id),\n      };\n    });\n\n    const base = {\n      isHome: view==='home', isSession: view==='session', isResults: view==='results',\n      xp: p.xp, streak: p.streak, level, rankName, xpToNext,\n      dailyXp: p.dailyXp, dailyGoal: p.dailyGoal,\n      dailyHeadline: goalPct>=1 ? 'Goal complete! 🎉' : (p.dailyXp>0 ? 'Keep climbing' : 'Ready for takeoff'),\n      ringCirc, ringOffset,\n      reviewSubtitle,\n      topics,\n      masteredTotal: this.masteredCount(null), itemTotal: this.ITEMS.length,\n      ctaHover: { transform:'translateY(-2px)', filter:'brightness(1.05)' },\n      closeHover: { background:'#F1F5FA', color:'#16202E' },\n      startReview: this.startReview,\n      goHome: this.goHome,\n      canInstall: this.state.canInstall,\n      install: this.install,\n    };\n\n    if (view === 'results' && this.state.session) {\n      const s = this.state.session;\n      const acc = s.graded ? Math.round((s.correct / s.graded) * 100) : 100;\n      const great = acc >= 80;\n      Object.assign(base, {\n        sessionXp: s.xp,\n        resultEmoji: great ? '🛩️' : (acc >= 50 ? '📈' : '🧭'),\n        resultTitle: great ? 'Cleared for takeoff!' : (acc >= 50 ? 'Nice progress' : 'Logbook entry made'),\n        resultSub: great ? 'Sharp work — those concepts are sticking.' : 'Every review moves cards up your mastery ladder. Keep going.',\n        resultAccuracy: acc + '%',\n      });\n      return base;\n    }\n\n    if (view !== 'session') return base;\n\n    // session\n    const s = this.state.session;\n    const it = this.cur();\n    const topic = this.TOPICS.find(t => t.id === it.topic);\n    const sessionPct = Math.round((s.index / s.queue.length) * 100) + '%';\n    Object.assign(base, {\n      sessionPct, sessionXp: s.xp,\n      curTopicName: topic.name, curTopicColor: topic.color, curTopicTint: topic.tint,\n      curKindLabel: it.type==='flash' ? 'Flashcard · '+(s.index+1)+'/'+s.queue.length : 'Quiz · '+(s.index+1)+'/'+s.queue.length,\n      isFlash: it.type==='flash', isMcq: it.type==='mcq',\n      quitSession: this.quitSession,\n    });\n\n    if (it.type === 'flash') {\n      Object.assign(base, {\n        flipped: s.flipped,\n        flashText: s.flipped ? it.back : it.front,\n        flashFaceLabel: s.flipped ? 'Answer' : 'Prompt',\n        flashHintVisible: !s.flipped,\n        flipCard: this.flipCard,\n        rateAgain:this.rateAgain, rateGood:this.rateGood, rateEasy:this.rateEasy,\n        goodDays: this.daysLabel(it.id, 1), easyDays: this.daysLabel(it.id, 2),\n        rateAgainHover:{ background:'#FBE3E1' }, rateGoodHover:{ background:'#E1EDFD' }, rateEasyHover:{ background:'#DEF3E8' },\n      });\n    } else {\n      const answered = s.answered;\n      const correctIdx = it.answer;\n      const optBase = 'width:100%; border:2px solid #E4EBF4; background:#fff; border-radius:16px; padding:14px 15px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:12px; transition:border-color .15s, background .15s;';\n      const letters = ['A','B','C','D','E'];\n      const mcqOptions = it.options.map((text, i) => {\n        let style = optBase, hover = { borderColor:'#B9CCE6', background:'#F7FAFE' };\n        let badgeBg = '#EDF2F8', badgeColor = '#64748B', mark='', markColor='transparent';\n        if (answered) {\n          hover = {};\n          if (i === correctIdx) { style = optBase.replace('#E4EBF4','#7FCBA5').replace('background:#fff','background:#EBF9F1'); badgeBg='#1F9D6B'; badgeColor='#fff'; mark='✓'; markColor='#1F9D6B'; }\n          else if (i === s.selected) { style = optBase.replace('#E4EBF4','#EDA79F').replace('background:#fff','background:#FDF1F0'); badgeBg='#E4574C'; badgeColor='#fff'; mark='✕'; markColor='#E4574C'; }\n          else { style = optBase + 'opacity:.5;'; }\n        }\n        return { text, letter:letters[i], style, hover, badgeBg, badgeColor, mark, markColor, onClick: () => this.pick(i) };\n      });\n      const wasCorrect = s.selected === correctIdx;\n      Object.assign(base, {\n        answered,\n        isFigureQ: !!it.fig,\n        figureEl: it.fig ? this.renderFigure(it.fig) : null,\n        mcqQuestion: it.q, mcqOptions, mcqExplain: it.explain,\n        explainBg: wasCorrect ? '#EBF9F1' : '#FDF3EC',\n        explainColor: wasCorrect ? '#158A5C' : '#C7702E',\n        explainTitle: wasCorrect ? 'Correct! 🎉' : 'Not quite — here\\u2019s why:',\n        nextItem: this.nextItem,\n        nextLabel: s.index+1 >= s.queue.length ? 'Finish' : 'Continue',\n        ctaHover: base.ctaHover,\n      });\n    }\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Preflight — Pilot Ground School</title>
  <meta name="description" content="A gamified study app for the FAA Private Pilot knowledge exam: flashcards, quizzes, matching, and free-write drills.">
  <meta name="theme-color" content="#16202E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #EEE6D4; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #root { min-height: 100vh; }
    #__loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #5A554A; background: #EEE6D4; z-index: 9999;
    }
  </style>
  <noscript>
    <style>#__loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#5A554A;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This app requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__loading">Loading Preflight&hellip;</div>
  <div id="root"></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          }

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

3px; letter-spacing:-.01em;\">{{ dailyHeadline }}<\u002Fdiv>\n      <div style=\"font-size:13px; color:#B8C4D4; font-weight:500;\">Level {{ level }} · {{ xpToNext }} XP to next rank<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Due for review CTA -->\n  <button onclick=\"{{ startReview }}\" style=\"margin-top:16px; width:100%; border:none; cursor:pointer; text-align:left; background:linear-gradient(135deg,#2E7DF6,#1B5FCC); color:#fff; border-radius:20px; padding:18px 20px; display:flex; align-items:center; gap:15px; box-shadow:0 10px 24px rgba(46,125,246,.32);\" style-hover=\"{{ ctaHover }}\">\n    <div style=\"width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none;\">⏱️<\u002Fdiv>\n    <div style=\"flex:1;\">\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px;\">Smart Review<\u002Fdiv>\n      <div style=\"font-size:13px; color:rgba(255,255,255,.85); font-weight:500;\">{{ reviewSubtitle }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:22px; opacity:.7;\">→<\u002Fdiv>\n  <\u002Fbutton>\n\n  <!-- Topics -->\n  <div style=\"margin:26px 4px 12px; display:flex; align-items:baseline; justify-content:space-between;\">\n    <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:17px; letter-spacing:-.01em;\">Knowledge Areas<\u002Fdiv>\n    <div style=\"font-size:12px; color:#94A3B8; font-weight:700;\">{{ masteredTotal }} / {{ itemTotal }} mastered<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:13px;\">\n    <sc-for list=\"{{ topics }}\" as=\"t\" hint-placeholder-count=\"6\">\n      <button onclick=\"{{ t.onClick }}\" style=\"{{ t.cardStyle }}\" style-hover=\"{{ t.hover }}\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;\">\n          <div style=\"width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; background:{{ t.tint }};\">{{ t.icon }}<\u002Fdiv>\n          <div style=\"font-size:12px; font-weight:800; color:{{ t.color }};\">{{ t.pct }}%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; line-height:1.2; letter-spacing:-.01em; text-align:left; min-height:36px;\">{{ t.name }}<\u002Fdiv>\n        <div style=\"margin-top:12px; height:7px; border-radius:5px; background:#EEF2F8; overflow:hidden;\">\n          <div style=\"height:100%; border-radius:5px; width:{{ t.pctStr }}; background:{{ t.color }};\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:9px; font-size:11.5px; color:#94A3B8; font-weight:600; text-align:left;\">{{ t.meta }}<\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"text-align:center; margin-top:26px; font-size:11.5px; color:#AEBACB; font-weight:500; line-height:1.5;\">Content based on the FAA Airplane Flying Handbook &amp; PHAK.<br>Study aid only — always consult current FAA publications.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= SESSION ================= -->\n<sc-if value=\"{{ isSession }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Session\" style=\"padding:18px 20px 40px; min-height:100vh; display:flex; flex-direction:column;\">\n\n  <!-- Session header -->\n  <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:20px;\">\n    <button onclick=\"{{ quitSession }}\" style=\"border:none; background:#fff; width:38px; height:38px; border-radius:12px; cursor:pointer; font-size:18px; color:#64748B; box-shadow:0 2px 8px rgba(20,32,46,.06); flex:none; display:flex; align-items:center; justify-content:center;\" style-hover=\"{{ closeHover }}\">✕<\u002Fbutton>\n    <div style=\"flex:1; height:14px; border-radius:8px; background:#DCE5F0; overflow:hidden;\">\n      <div style=\"height:100%; border-radius:8px; background:linear-gradient(90deg,#2E7DF6,#5F9BFF); width:{{ sessionPct }}; transition:width .35s cubic-bezier(.2,.8,.2,1);\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:5px; flex:none;\">\n      <span style=\"width:8px; height:8px; border-radius:3px; background:#7C5CFC; display:inline-block;\"><\u002Fspan>\n      <span style=\"font-weight:800; font-size:15px; color:#7C5CFC;\">+{{ sessionXp }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:16px;\">\n    <span style=\"font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:{{ curTopicColor }}; background:{{ curTopicTint }}; padding:5px 10px; border-radius:8px;\">{{ curTopicName }}<\u002Fspan>\n    <span style=\"font-size:12px; font-weight:700; color:#94A3B8;\">{{ curKindLabel }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ===== FLASHCARD ===== -->\n  <sc-if value=\"{{ isFlash }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1; display:flex; flex-direction:column;\">\n    <button onclick=\"{{ flipCard }}\" style=\"flex:1; min-height:300px; width:100%; border:none; cursor:pointer; background:#fff; border-radius:26px; padding:34px 28px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 16px 40px rgba(20,32,46,.10); animation:cardIn .35s ease both; position:relative;\">\n      <div style=\"position:absolute; top:20px; left:22px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#B4C0D0;\">{{ flashFaceLabel }}<\u002Fdiv>\n      <div style=\"position:absolute; top:18px; right:22px; font-size:20px;\">🃏<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:24px; line-height:1.28; letter-spacing:-.01em; color:#16202E; max-width:520px;\">{{ flashText }}<\u002Fdiv>\n      <sc-if value=\"{{ flashHintVisible }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:22px; font-size:13px; font-weight:700; color:#2E7DF6; background:#EAF2FE; padding:9px 16px; border-radius:20px;\">Tap to reveal answer<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fbutton>\n\n    <!-- rating buttons -->\n    <sc-if value=\"{{ flipped }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:16px; animation:popIn .3s ease both;\">\n      <div style=\"text-align:center; font-size:13px; font-weight:700; color:#64748B; margin-bottom:10px;\">How well did you know it?<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:10px;\">\n        <button onclick=\"{{ rateAgain }}\" style=\"border:2px solid #F6D5D2; background:#FDF1F0; color:#D6483C; border-radius:16px; padding:14px 8px; cursor:pointer; font-family:inherit; font-weight:800; font-size:14px;\" style-hover=\"{{ rateAgainHover }}\">\n          <div style=\"font-size:20px; margin-bottom:3px;\">↻<\u002Fdiv>Again\n          <div style=\"font-size:10.5px; font-weight:600; color:#B87C77; margin-top:2px;\">Show soon<\u002Fdiv>\n        <\u002Fbutton>\n        <button onclick=\"{{ rateGood }}\" style=\"border:2px solid #CFE0FA; background:#EDF4FE; color:#1B5FCC; border-radius:16px; padding:14px 8px; cursor:pointer; font-family:inherit; font-weight:800; font-size:14px;\" style-hover=\"{{ rateGoodHover }}\">\n          <div style=\"font-size:20px; margin-bottom:3px;\">✓<\u002Fdiv>Good\n          <div style=\"font-size:10.5px; font-weight:600; color:#7FA0CF; margin-top:2px;\">{{ goodDays }}<\u002Fdiv>\n        <\u002Fbutton>\n        <button onclick=\"{{ rateEasy }}\" style=\"border:2px solid #C7ECD8; background:#EBF9F1; color:#158A5C; border-radius:16px; padding:14px 8px; cursor:pointer; font-family:inherit; font-weight:800; font-size:14px;\" style-hover=\"{{ rateEasyHover }}\">\n          <div style=\"font-size:20px; margin-bottom:3px;\">★<\u002Fdiv>Easy\n          <div style=\"font-size:10.5px; font-weight:600; color:#77BF9C; margin-top:2px;\">{{ easyDays }}<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== MULTIPLE CHOICE ===== -->\n  <sc-if value=\"{{ isMcq }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"flex:1; display:flex; flex-direction:column;\">\n    <sc-if value=\"{{ isFigureQ }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#12161c; border-radius:24px; padding:18px; margin-bottom:12px; display:flex; flex-direction:column; align-items:center; box-shadow:0 12px 32px rgba(20,32,46,.14);\">\n        <div style=\"width:200px; height:200px;\">{{ figureEl }}<\u002Fdiv>\n        <div style=\"margin-top:8px; font-size:11px; font-weight:700; letter-spacing:.14em; color:#7f8b9a; font-family:'Bricolage Grotesque',sans-serif;\">FIGURE — INTERPRET THE INSTRUMENT<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"background:#fff; border-radius:24px; padding:26px 24px; box-shadow:0 12px 32px rgba(20,32,46,.08); animation:cardIn .35s ease both;\">\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:21px; line-height:1.34; letter-spacing:-.01em;\">{{ mcqQuestion }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:14px; display:flex; flex-direction:column; gap:11px;\">\n      <sc-for list=\"{{ mcqOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n        <button onclick=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\" style-hover=\"{{ opt.hover }}\">\n          <span style=\"width:28px; height:28px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; background:{{ opt.badgeBg }}; color:{{ opt.badgeColor }};\">{{ opt.letter }}<\u002Fspan>\n          <span style=\"flex:1; text-align:left; font-weight:600; font-size:15px; line-height:1.35;\">{{ opt.text }}<\u002Fspan>\n          <span style=\"font-size:18px; font-weight:800; color:{{ opt.markColor }};\">{{ opt.mark }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- explanation -->\n    <sc-if value=\"{{ answered }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:16px; background:{{ explainBg }}; border-radius:18px; padding:16px 18px; animation:popIn .3s ease both;\">\n      <div style=\"font-weight:800; font-size:14px; color:{{ explainColor }}; margin-bottom:5px;\">{{ explainTitle }}<\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.5; color:#334155; font-weight:500;\">{{ mcqExplain }}<\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ nextItem }}\" style=\"margin-top:16px; width:100%; border:none; cursor:pointer; background:linear-gradient(135deg,#2E7DF6,#1B5FCC); color:#fff; border-radius:18px; padding:17px; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; box-shadow:0 10px 24px rgba(46,125,246,.3);\" style-hover=\"{{ ctaHover }}\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= RESULTS ================= -->\n<sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Results\" style=\"padding:20px; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;\">\n  <div style=\"font-size:64px; animation:floatY 2.4s ease-in-out infinite;\">{{ resultEmoji }}<\u002Fdiv>\n  <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:30px; letter-spacing:-.02em; margin-top:12px;\">{{ resultTitle }}<\u002Fdiv>\n  <div style=\"font-size:15px; color:#64748B; font-weight:600; margin-top:6px; max-width:340px;\">{{ resultSub }}<\u002Fdiv>\n\n  <div style=\"display:flex; gap:12px; margin-top:28px; width:100%; max-width:420px;\">\n    <div style=\"flex:1; background:#fff; border-radius:20px; padding:18px 10px; box-shadow:0 8px 22px rgba(20,32,46,.07);\">\n      <div style=\"font-size:22px;\">💜<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:24px; color:#7C5CFC; margin-top:4px;\">+{{ sessionXp }}<\u002Fdiv>\n      <div style=\"font-size:11.5px; font-weight:700; color:#94A3B8; letter-spacing:.03em;\">XP EARNED<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; background:#fff; border-radius:20px; padding:18px 10px; box-shadow:0 8px 22px rgba(20,32,46,.07);\">\n      <div style=\"font-size:22px;\">🎯<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:24px; color:#1F9D6B; margin-top:4px;\">{{ resultAccuracy }}<\u002Fdiv>\n      <div style=\"font-size:11.5px; font-weight:700; color:#94A3B8; letter-spacing:.03em;\">ACCURACY<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; background:#fff; border-radius:20px; padding:18px 10px; box-shadow:0 8px 22px rgba(20,32,46,.07);\">\n      <div style=\"font-size:22px;\">🔥<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:24px; color:#F5A623; margin-top:4px;\">{{ streak }}<\u002Fdiv>\n      <div style=\"font-size:11.5px; font-weight:700; color:#94A3B8; letter-spacing:.03em;\">DAY STREAK<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <button onclick=\"{{ goHome }}\" style=\"margin-top:28px; width:100%; max-width:420px; border:none; cursor:pointer; background:linear-gradient(135deg,#2E7DF6,#1B5FCC); color:#fff; border-radius:18px; padding:18px; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; box-shadow:0 12px 28px rgba(46,125,246,.32);\" style-hover=\"{{ ctaHover }}\">Back to Hangar<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.TOPICS = [\n      { id:'aero',    name:'Principles of Flight',   icon:'🪁', color:'#2E7DF6', tint:'#E7F0FE' },\n      { id:'systems', name:'Systems & Instruments',  icon:'🎛️', color:'#7C5CFC', tint:'#EFEBFE' },\n      { id:'weather', name:'Weather',                icon:'🌦️', color:'#17A6C4', tint:'#E2F6FA' },\n      { id:'regs',    name:'Regulations & Airspace', icon:'📋', color:'#E8894A', tint:'#FCEFE4' },\n      { id:'nav',     name:'Navigation',            icon:'🧭', color:'#E05B8A', tint:'#FCE9F0' },\n      { id:'medical', name:'Aeromedical Factors',   icon:'🫀', color:'#1F9D6B', tint:'#E4F6EE' },\n      { id:'figures', name:'Instrument & Chart Reading', icon:'📊', color:'#0E9FA0', tint:'#DCF3F3' },\n    ];\n    this.ITEMS = this.buildItems();\n    const saved = this.load();\n    this.state = {\n      view: 'home',\n      profile: saved,\n      session: null,\n      canInstall: false,\n    };\n  }\n\n  componentDidMount() {\n    // Offline support\n    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {\n      navigator.serviceWorker.register('sw.js').catch(function(){});\n    }\n    // Capture the install prompt (Android/desktop Chrome/Edge)\n    window.addEventListener('beforeinstallprompt', (e) => {\n      e.preventDefault();\n      this._deferredPrompt = e;\n      this.setState({ canInstall: true });\n    });\n    window.addEventListener('appinstalled', () => {\n      this._deferredPrompt = null;\n      this.setState({ canInstall: false });\n    });\n  }\n\n  install = () => {\n    const p = this._deferredPrompt;\n    if (!p) return;\n    p.prompt();\n    p.userChoice.finally(() => { this._deferredPrompt = null; this.setState({ canInstall: false }); });\n  }\n\n  // ---------- content ----------\n  buildItems() {\n    const F = (topic, front, back) => ({ topic, type:'flash', front, back });\n    const M = (topic, q, options, answer, explain) => ({ topic, type:'mcq', q, options, answer, explain });\n    const G = (topic, fig, q, options, answer, explain) => ({ topic, type:'mcq', fig, q, options, answer, explain });\n    const raw = [\n      // AERO\n      F('aero','The four forces acting on an airplane in flight','Lift, Weight, Thrust, and Drag. In steady, unaccelerated flight they are in balance.'),\n      M('aero','What produces the lift on an airplane wing?',['A pressure differential plus downward deflection of air (Bernoulli + Newton\\u2019s 3rd law)','Engine thrust alone','The tail pushing the nose up','Centrifugal force from the propeller'],0,'Lift comes from lower pressure over the curved upper surface and the downward deflection of air off the wing \\u2014 both effects act together.'),\n      M('aero','An airplane always stalls at the same:',['Airspeed','Angle of attack (the critical AOA)','Pitch attitude','Altitude'],1,'A wing stalls whenever the critical angle of attack is exceeded \\u2014 regardless of airspeed, weight, or attitude.'),\n      F('aero','Angle of attack','The angle between the wing\\u2019s chord line and the relative wind.'),\n      M('aero','In a level, coordinated turn, load factor:',['Stays at 1 G','Decreases with bank','Increases as bank angle steepens','Depends only on airspeed'],2,'Steeper banks require more lift to maintain altitude, increasing load factor \\u2014 which also raises stall speed.'),\n      F('aero','Ground effect','Reduced induced drag that occurs within about one wingspan of the surface \\u2014 can cause floating on landing or premature liftoff.'),\n      M('aero','The tendency of an airplane to yaw left at high power and low airspeed (climb) is countered mainly by:',['Left rudder','Right rudder','Aileron only','Nose-down trim'],1,'Torque, P-factor, spiraling slipstream and gyroscopic precession combine to yaw the nose left; right rudder corrects it.'),\n\n      // SYSTEMS\n      F('systems','The pitot-static instruments','Airspeed indicator, altimeter, and vertical speed indicator.'),\n      M('systems','Which instrument uses BOTH the pitot (ram air) and the static system?',['Altimeter','Vertical speed indicator','Airspeed indicator','Heading indicator'],2,'Only the airspeed indicator compares ram-air (pitot) pressure to static pressure; the altimeter and VSI use static only.'),\n      M('systems','If the pitot tube ram-air inlet becomes blocked (drain and static open), the airspeed indicator will:',['Read normally','Read zero','Freeze at current value','Read high'],1,'With the ram inlet blocked but the drain open, trapped pressure bleeds out and the ASI drops toward zero.'),\n      F('systems','The gyroscopic flight instruments','Attitude indicator, heading indicator, and turn coordinator.'),\n      F('systems','100LL aviation gasoline color','Blue.'),\n      M('systems','Magnetic compass error remembered as \"ANDS\" refers to errors during:',['Turns','Climbs','Acceleration and deceleration on E/W headings','Descents'],2,'ANDS \\u2014 Accelerate North, Decelerate South \\u2014 the compass shows a false N/S turn when speeding up or slowing on east/west headings.'),\n      F('systems','UNOS compass rule','Undershoot North, Overshoot South \\u2014 when rolling out of a turn onto a northerly or southerly heading in the Northern Hemisphere.'),\n\n      // WEATHER\n      M('weather','A small and decreasing temperature/dew-point spread indicates an increasing chance of:',['Clear skies','Fog or low clouds','High winds','Thunderstorms'],1,'As temperature and dew point converge, the air nears saturation \\u2014 favoring fog, mist, and low cloud formation.'),\n      F('weather','Standard sea-level temperature and pressure','15\\u00b0C and 29.92 inHg (1013.2 hPa).'),\n      M('weather','Standard temperature lapse rate in the troposphere is about:',['1\\u00b0C per 1,000 ft','2\\u00b0C per 1,000 ft','3.5\\u00b0C per 1,000 ft','5\\u00b0C per 1,000 ft'],1,'Standard lapse rate is roughly 2\\u00b0C (3.5\\u00b0F) per 1,000 ft of altitude gain.'),\n      F('weather','What is a METAR?','A routine, observed surface weather report for an airport \\u2014 current conditions, not a forecast.'),\n      M('weather','Which cloud type is associated with severe turbulence, hail, and thunderstorms?',['Stratus','Cirrus','Cumulonimbus','Altocumulus'],2,'Cumulonimbus clouds contain powerful updrafts/downdrafts and are the signature of thunderstorm activity \\u2014 avoid them.'),\n      M('weather','Compared with a warm front, a cold front typically brings:',['Slow, widespread, steady rain','Fast-moving weather with brief, intense precipitation','No change in wind','Improving visibility only'],1,'Cold fronts move faster and lift air steeply, producing narrow bands of intense showers, gusty winds, and sometimes thunderstorms.'),\n      F('weather','What does a TAF provide?','A Terminal Aerodrome Forecast \\u2014 the expected weather within ~5 sm of an airport, typically for 24\\u201330 hours.'),\n\n      // REGS\n      M('regs','Daytime VFR minimums in Class E below 10,000 ft MSL require flight visibility of at least:',['1 statute mile','3 statute miles','5 statute miles','No minimum'],1,'Class E (below 10,000 MSL) day VFR requires 3 statute miles visibility.'),\n      F('regs','Cloud clearance in Class E below 10,000 ft MSL','500 ft below, 1,000 ft above, 2,000 ft horizontal.'),\n      M('regs','A steady GREEN light gun signal from the tower to an aircraft in flight means:',['Return to airport','Cleared to land','Give way to other aircraft','Airport unsafe, do not land'],1,'In flight, a steady green light-gun signal means \"cleared to land.\"'),\n      F('regs','ARROW','Documents required aboard the aircraft: Airworthiness certificate, Registration, Radio license (if international), Operating limitations, Weight & balance.'),\n      M('regs','FAR 91.103 requires that, before every flight, the pilot in command:',['Only check fuel','Become familiar with all available information concerning that flight','File a flight plan','Call flight service'],1,'91.103 requires the PIC to review all available information \\u2014 weather, runway lengths, performance, alternatives, and NOTAMs.'),\n      F('regs','Class B airspace shape','An upside-down wedding cake surrounding the busiest airports \\u2014 an ATC clearance is required to enter.'),\n      M('regs','VFR cruising altitude above 3,000 ft AGL on a magnetic course of 0\\u2013179\\u00b0:',['Even thousands + 500 ft','Odd thousands + 500 ft','Any even thousand','Any altitude'],1,'Eastbound (0\\u2013179\\u00b0): odd thousands + 500 (3,500; 5,500\\u2026). Westbound (180\\u2013359\\u00b0): even thousands + 500.'),\n\n      // NAV\n      F('nav','Magnetic variation','The angular difference between true north and magnetic north at a given location.'),\n      M('nav','To convert a true course to a compass heading you apply, in order:',['Deviation then variation','Variation then deviation','Wind then variation','Nothing \\u2014 they\\u2019re the same'],1,'True \\u2192 apply Variation \\u2192 Magnetic \\u2192 apply Deviation \\u2192 Compass (remembered as \"True Virgins Make Dull Companions\").'),\n      M('nav','One nautical mile is approximately:',['1.0 statute mile','1.15 statute miles','2.0 statute miles','0.87 statute mile'],1,'1 NM \\u2248 1.15 statute miles \\u2248 6,076 feet \\u2248 1,852 meters.'),\n      F('nav','Pilotage','Navigating by direct reference to visible landmarks on the ground.'),\n      F('nav','Dead reckoning','Navigation by computation \\u2014 using known heading, groundspeed, wind, and time to predict position.'),\n      M('nav','A VOR is:',['A satellite navigation system','A VHF ground station that transmits radials/bearings','A weather radar','A transponder code'],1,'VOR = VHF Omnidirectional Range \\u2014 a ground-based navaid providing 360 courses (radials) to/from the station.'),\n      F('nav','Isogonic line','A line on a chart connecting points of equal magnetic variation (the agonic line is where variation is zero).'),\n\n      // MEDICAL\n      M('medical','Hypoxia is:',['Too much oxygen','Insufficient oxygen reaching the body\\u2019s tissues','A buildup of CO2','Low blood sugar'],1,'Hypoxia is oxygen deficiency; symptoms include euphoria, impaired judgment, and cyanosis \\u2014 insidious and dangerous with altitude.'),\n      F('medical','Hyperventilation','Breathing too fast/deep expels excess CO2, causing dizziness and tingling. Treatment: slow the breathing rate; talk aloud.'),\n      M('medical','The best way to overcome spatial disorientation is to:',['Rely on bodily sensations','Trust and fly the flight instruments','Close your eyes briefly','Increase speed'],1,'Bodily senses are unreliable without outside references; believe the instruments and fly them.'),\n      M('medical','Supplemental oxygen is required for the required flight crew above what cabin pressure altitude for flights over 30 minutes?',['8,000 ft','10,000 ft','12,500 ft','14,000 ft'],2,'FAR 91.211: crew oxygen is required above 12,500 ft MSL cabin altitude if that portion exceeds 30 minutes (continuously above 14,000 ft).'),\n      F('medical','8-hour bottle-to-throttle / 0.04% rule','FAR 91.17 alcohol limits: no flying within 8 hours of drinking, while impaired, or with a blood alcohol level of 0.04% or greater.'),\n      M('medical','At night, the best way to detect another aircraft or object is to:',['Stare directly at it','Use off-center (peripheral) scanning','Look only at instruments','Use landing lights'],1,'The eye\\u2019s night-blind spot is in the center; scanning slightly off-center uses the more light-sensitive rods.'),\n      F('medical','Carbon monoxide hazard','CO can leak from a cracked exhaust into the cabin heater. Odorless; causes headache, drowsiness, and impaired judgment \\u2014 vent and land.'),\n\n      // ===== AERO (added) =====\n      M('aero',\"Bernoulli's principle states that as the velocity of a fluid increases, its:\",[\"Pressure decreases\",\"Pressure increases\",\"Temperature drops to zero\",\"Density doubles\"],0,\"Faster-moving air over the curved upper wing surface has lower static pressure, contributing to lift.\"),\n      F('aero','Chord line','A straight line from the leading edge to the trailing edge of an airfoil.'),\n      F('aero','Relative wind','The direction of the airflow with respect to the wing \\u2014 always opposite the flight path.'),\n      M('aero','Induced drag is greatest when the airplane is flying at:',['High speed','Low airspeed / high angle of attack','Cruise speed','Best glide only'],1,'Induced drag is a by-product of lift and is highest at low speed and high AOA; parasite drag dominates at high speed.'),\n      M('aero','Parasite drag (form, skin friction) increases:',['As airspeed increases (with the square of speed)','As airspeed decreases','Only in turns','Only with flaps down'],0,'Parasite drag rises rapidly with airspeed, while induced drag falls \\u2014 total drag is lowest where they cross (L/Dmax).'),\n      M('aero','An airplane achieves its maximum glide range at the speed for:',['Minimum drag / best lift-to-drag ratio (L/Dmax)','Maximum drag','Never-exceed speed','Stall speed'],0,'Best glide speed corresponds to L/Dmax \\u2014 the point of minimum total drag, giving the most distance per foot of altitude.'),\n      F('aero','L/Dmax (best glide)','The angle of attack / airspeed producing the greatest lift-to-drag ratio and the flattest glide.'),\n      M('aero','Recovery from a stall is accomplished primarily by:',['Adding full power only','Reducing the angle of attack (lowering the nose)','Pulling back on the yoke','Applying full rudder'],1,'A stall is an excessive-AOA condition; reducing AOA restores smooth airflow. Power helps minimize altitude loss.'),\n      M('aero','A spin requires which two elements?',['Stall plus yaw','High speed plus bank','Power plus flaps','Ice plus turbulence'],0,'A spin is an aggravated stall with yaw \\u2014 one wing is more stalled than the other, causing autorotation.'),\n      F('aero','PARE (spin recovery)','Power idle, Ailerons neutral, Rudder full opposite the spin, Elevator briskly forward \\u2014 then recover from the dive.'),\n      M('aero','Vx and Vy differ in that:',['Vx gives the steepest climb (most altitude per distance); Vy gives the fastest climb (most altitude per time)','They are identical','Vy is always slower','Vx is used only in descents'],0,'Use Vx to clear obstacles (best angle) and Vy for the quickest altitude gain (best rate).'),\n      F('aero','Va (maneuvering speed)','The maximum speed at which full, abrupt control movement will cause the wing to stall before overstressing the airframe.'),\n      M('aero','Maneuvering speed (Va):',['Increases at lighter weights','Decreases at lighter weights','Never changes','Only applies in cruise'],1,'A lighter airplane reaches its limit load factor at a lower speed, so Va is lower when lighter.'),\n      M('aero','Wing dihedral (upward angle) primarily provides:',['Lateral (roll) stability','Directional stability','Longitudinal stability','More lift'],0,'Dihedral rolls the airplane back toward level when a wing drops \\u2014 improving lateral stability.'),\n      M('aero','Adverse yaw (the nose yawing away from a turn) is corrected with:',['Coordinated rudder in the direction of the turn','Opposite aileron','Nose-down elevator','More power'],0,'The rising outside wing has more induced drag; applying rudder into the turn keeps it coordinated.'),\n      M('aero','Wingtip vortices (wake turbulence) are strongest when the generating aircraft is:',['Heavy, clean, and slow','Light, dirty, and fast','On the ground','In a descent'],0,'Vortex strength is greatest for a heavy, clean (no flaps/gear), slow aircraft \\u2014 avoid its flight path and touchdown point.'),\n      M('aero','Loading an airplane with a more FORWARD center of gravity results in:',['Greater longitudinal stability and a higher stall speed','Less stability','Lower stall speed','No effect'],0,'A forward CG is more stable but requires more elevator/tail down-force, raising stall speed and using more runway.'),\n      M('aero','An AFT center of gravity makes an airplane:',['Less longitudinally stable and harder to recover from a stall/spin','More stable','Unable to fly','Slower only'],0,'An aft CG reduces stability and elevator authority, and can make stall/spin recovery difficult \\u2014 stay within limits.'),\n      F('aero','Washout','A built-in twist so the wing root has a higher angle of incidence than the tip \\u2014 the root stalls first, keeping ailerons effective.'),\n      M('aero','Frost on the wings before takeoff:',['Must be removed \\u2014 it disrupts airflow and can prevent the wing from producing enough lift','Improves lift','Is harmless if thin','Only matters in flight'],0,'Even a thin layer of frost roughens the surface, spoiling lift and raising stall speed \\u2014 remove all frost before flight.'),\n      M('aero','In coordinated flight the inclinometer (ball) is:',['Centered','To the inside of the turn','To the outside of the turn','Full deflection'],0,'A centered ball means the turn is coordinated \\u2014 no slip or skid. Step on the ball to correct.'),\n      M('aero','Increasing gross weight causes stall speed to:',['Increase','Decrease','Stay the same','Become zero'],0,'A heavier airplane needs more lift, so it must fly at a higher speed to reach the critical AOA \\u2014 stall speed rises.'),\n\n      // ===== SYSTEMS (added) =====\n      M('systems','If the static port becomes blocked (pitot open), the altimeter will:',['Freeze at the altitude where the blockage occurred','Read zero','Wind backward','Read double'],0,'With a blocked static source the altimeter is stuck; the VSI reads zero and the airspeed indicator becomes inaccurate.'),\n      M('systems','Selecting the alternate static source (unpressurized cabin) typically causes the altimeter to read:',['Slightly higher than actual','Zero','Exactly correct','Slightly lower'],0,'Cabin static pressure is usually a bit lower than outside, so the altimeter and airspeed read a little high; the VSI shows a momentary climb.'),\n      M('systems','The attitude indicator operates on the gyroscopic principle of:',['Rigidity in space','Precession only','Bernoulli','Magnetic dip'],0,'A gyro spinning rigidly in space provides a stable reference; the case moves around it to show pitch and bank.'),\n      M('systems','The heading indicator must be periodically reset to the magnetic compass because it:',['Precesses (drifts) over time','Has no power','Reads airspeed','Only works at night'],0,'Friction causes gyro precession; realign the heading indicator with the magnetic compass about every 15 minutes in straight-and-level flight.'),\n      M('systems','A standard-rate turn is a turn of:',['3 degrees per second (a 2-minute 360)','1 degree per second','10 degrees per second','30 degrees of bank always'],0,'The turn coordinator is calibrated to 3 deg/sec at the standard-rate index \\u2014 a full circle in two minutes.'),\n      M('systems','During run-up, no RPM drop when a magneto is selected indicates:',['A broken P-lead (magneto ground wire) \\u2014 the mag is hot even when off','Normal operation','A dead battery','Carburetor ice'],0,'No drop means the magneto is not being grounded; the prop must be treated as live. This is a hazard requiring maintenance.'),\n      M('systems','Carburetor icing is most likely with:',['High humidity and temperatures roughly 20 to 70 F, especially at reduced power','Very cold, dry air only','High power in dry air','Any clear day'],0,'Fuel vaporization and pressure drop in the venturi can freeze moisture even in warm weather; use carb heat as a preventive.'),\n      M('systems','Applying carburetor heat:',['Uses warm, unfiltered air, which richens the mixture and lowers RPM','Cools the engine','Increases RPM','Has no effect'],0,'Carb heat routes warm air around the exhaust to melt ice; expect an initial RPM drop and a richer mixture.'),\n      M('systems','As altitude increases, the fuel/air mixture should be:',['Leaned, because the air is less dense','Enriched','Left full rich always','Turned off'],0,'Thinner air at altitude makes a fixed mixture too rich; leaning restores the proper ratio and smooth operation.'),\n      M('systems','A fuel-injected engine, compared with a carbureted one, is:',['Less susceptible to induction icing','More prone to carb ice','Unable to run lean','Always turbocharged'],0,'Fuel injection meters fuel at the cylinders without a venturi, so it avoids classic carburetor icing.'),\n      M('systems','Detonation is most likely caused by:',['Fuel of too low an octane, or operating too lean at high power','Too much oil','Cold weather','Low RPM'],0,'Detonation is an uncontrolled explosion of the fuel/air charge; use the correct grade of fuel and avoid high power with a lean mixture.'),\n      M('systems','The alternator/generator in a light aircraft:',['Charges the battery and powers the electrical system when the engine runs','Starts the engine','Fires the spark plugs','Runs the vacuum instruments'],0,'The ammeter shows charge or discharge; magnetos, not the alternator, fire the plugs, so the engine runs even with total electrical failure.'),\n      M('systems','If the alternator fails in flight, you should:',['Shed nonessential electrical loads \\u2014 the battery is now the only source','Land immediately, engine will quit','Turn off the magnetos','Increase RPM to recharge'],0,'The engine keeps running on the magnetos; conserve battery power for essential radios and gear.'),\n      M('systems','The vacuum (suction) system typically powers the:',['Attitude indicator and heading indicator','Airspeed indicator','Altimeter','Fuel gauge'],0,'Many trainers drive the attitude and heading gyros with engine-driven vacuum; a vacuum failure loses those two instruments.'),\n      F('systems','The four-stroke engine cycle','Intake, Compression, Power (combustion), Exhaust \\u2014 one power stroke every two crankshaft revolutions.'),\n      M('systems','On a constant-speed propeller, the propeller control sets:',['RPM (by changing blade pitch); the throttle sets manifold pressure','Manifold pressure','Mixture','Fuel flow only'],0,'A governor holds the selected RPM by adjusting blade pitch; when reducing power, reduce manifold pressure (throttle) before RPM.'),\n      F('systems','Emergency squawk codes','7500 = hijack, 7600 = lost communications, 7700 = general emergency.'),\n      M('systems','A VFR aircraft not in contact with ATC squawks:',['1200','7500','0000','7700'],0,'1200 is the standard VFR transponder code; Mode C also reports pressure altitude.'),\n      F('systems','Magneto independence','Magnetos generate their own spark independent of the electrical system, so the engine runs even with a dead battery/alternator.'),\n      M('systems','A sudden drop in oil pressure with rising oil temperature indicates:',['Possible loss of oil \\u2014 prepare to land as soon as practical','Normal cruise','Carb ice','Low fuel'],0,'Loss of lubrication can quickly destroy an engine; reduce power and land while options remain.'),\n\n      // ===== WEATHER (added) =====\n      M('weather','A mature thunderstorm cell is characterized by:',['Both strong updrafts and downdrafts, plus heavy precipitation','Only gentle updrafts','No precipitation','Clear skies'],0,'The mature stage is the most hazardous \\u2014 severe turbulence, heavy rain, lightning, and possible hail and gusts.'),\n      M('weather','A microburst is:',['A powerful, localized downdraft causing severe low-level wind shear','A steady crosswind','A type of fog','A high-altitude jet stream'],0,'Microbursts near thunderstorms can produce a rapid headwind-to-tailwind shift on approach \\u2014 avoid takeoff/landing near them.'),\n      M('weather','Radiation fog typically forms:',['On clear, calm nights as the ground cools moist air to its dew point','In strong winds','Over the open ocean','During thunderstorms'],0,'Ground-cooling on calm, clear nights lowers surface air to saturation \\u2014 common in valleys near dawn.'),\n      M('weather','Advection fog forms when:',['Warm, moist air moves over a cooler surface (needs some wind)','Air is perfectly still','The ground heats rapidly','A cold front passes'],0,'Advection fog needs wind to move moist air over a cool surface (e.g., coastal areas) and can be persistent.'),\n      F('weather','Dew point','The temperature to which air must be cooled to become saturated \\u2014 a small temperature/dew-point spread means moisture is near saturation.'),\n      M('weather','Stable air is generally associated with:',['Stratiform clouds, steady precipitation, smooth air, and poor visibility','Cumulus clouds and turbulence','Showers and good visibility','Thunderstorms'],0,'Stable air resists vertical motion \\u2014 expect layered clouds, drizzle, and haze trapped near the surface.'),\n      M('weather','Unstable, moist air typically produces:',['Cumuliform clouds, showery precipitation, turbulence, and good visibility','Smooth stratus and haze','Steady rain','No clouds'],0,'Unstable air rises readily, forming towering cumulus and showers with generally good visibility between showers.'),\n      M('weather','A temperature inversion is a layer where:',['Temperature increases with altitude \\u2014 very stable, often trapping haze and possible wind shear','Temperature drops rapidly','Winds are calm always','No moisture exists'],0,'Inversions cap vertical mixing; expect smooth but hazy air below and possible low-level wind shear at the top.'),\n      M('weather','During the day, a sea breeze blows:',['From the water toward the warmer land','From land to sea','Straight up','Only at night'],0,'Land heats faster than water by day, so cooler air flows in from the sea; at night the land breeze reverses.'),\n      F('weather','Wind shear','A sudden change in wind speed and/or direction over a short distance \\u2014 hazardous near thunderstorms, fronts, and inversions.'),\n      M('weather','Standing lenticular (lens-shaped) clouds near mountains indicate:',['Mountain-wave activity and possible severe turbulence','Calm, smooth air','Approaching fog','Improving weather'],0,'Lenticular clouds mark mountain waves; expect turbulence and strong up/downdrafts even in clear air.'),\n      F('weather','Clear ice vs. rime ice','Clear ice is smooth, heavy, hard to remove (large drops); rime ice is rough, milky, brittle (small drops). Mixed ice combines both.'),\n      M('weather','Structural (airframe) icing requires:',['Visible moisture and temperatures at or below freezing','Only cold air','Only high humidity','Sunshine'],0,'Both visible moisture (clouds, rain) and a freezing surface temperature must be present for ice to accrete.'),\n      M('weather','A SIGMET is issued for:',['Weather hazardous to all aircraft (severe icing, severe turbulence, dust/sand, volcanic ash)','Routine conditions','VFR forecasts only','Airport delays'],0,'A Convective SIGMET covers thunderstorms/tornadoes/hail; AIRMETs cover less severe conditions affecting lighter aircraft.'),\n      M('weather','AIRMET Zulu concerns:',['Icing and freezing levels','Turbulence','IFR conditions and mountain obscuration','Thunderstorms'],0,'AIRMET Sierra = IFR/obscuration, Tango = turbulence/strong winds, Zulu = icing and freezing levels.'),\n      F('weather','PIREP','A Pilot Report of actual in-flight conditions (turbulence, icing, cloud tops, visibility) \\u2014 timely, real-world weather.'),\n      M('weather','You should set your altimeter to:',['The current setting of a nearby station (within 100 NM)','Field elevation always','29.92 below 18,000 ft','Any value'],0,'Set the local altimeter setting so the altimeter reads correct altitude; use 29.92 at and above 18,000 ft (flight levels).'),\n      M('weather','Flying from a high-pressure area into lower pressure without resetting the altimeter, your true altitude is:',['Lower than indicated \\u2014 \"high to low, look out below\"','Higher than indicated','Exactly indicated','Unaffected'],0,'The altimeter over-reads when actual pressure is lower than the set value \\u2014 you are closer to terrain than it shows.'),\n      M('weather','High density altitude (hot day, high elevation, high humidity) causes:',['Reduced engine power, lift, and climb \\u2014 longer takeoff and landing rolls','Better performance','No change','Lower stall speed'],0,'Thin air degrades aerodynamic and engine performance; density altitude is pressure altitude corrected for nonstandard temperature.'),\n      F('weather','Density altitude','Pressure altitude corrected for nonstandard temperature \\u2014 the altitude the airplane \"feels.\" High DA = poor performance.'),\n      M('weather','A safe distance to avoid a thunderstorm is at least:',['20 nautical miles','2 miles','5 miles','Directly underneath'],0,'Hail and turbulence can extend well outside the visible cloud; give thunderstorms a wide berth of 20 NM.'),\n      M('weather','A squall line is:',['A narrow band of active thunderstorms, often ahead of a cold front','A gentle warm front','A fog bank','A high-pressure ridge'],0,'Squall lines can be too solid to fly through and contain the most violent weather \\u2014 avoid, do not penetrate.'),\n\n      // ===== REGS (added) =====\n      M('regs','To enter Class C airspace you must:',['Establish two-way radio communication before entering and have a Mode C transponder','Get a written clearance','Do nothing','File IFR'],0,'Class C requires two-way comms established (they say your call sign) and an operating altitude-reporting transponder.'),\n      M('regs','Operations in Class D airspace require:',['Two-way radio communication with the tower','A Mode C transponder','An instrument rating','A clearance to land only'],0,'Class D (towered field) needs two-way radio contact established before entering the surface area.'),\n      M('regs','Entering Class B airspace requires:',['A specific ATC clearance (\"cleared into the Class Bravo\") plus a Mode C transponder','Only two-way radio','Nothing for VFR','An IFR flight plan'],0,'You must hear the words \"cleared into the Class B\"; a student pilot needs a logbook endorsement for that airspace.'),\n      M('regs','In Class G airspace below 1,200 ft AGL (day), VFR minimums are:',['1 statute mile visibility and clear of clouds','3 miles and 152','5 miles','No visibility needed'],0,'Uncontrolled Class G is least restrictive by day at low altitude: 1 SM and clear of clouds.'),\n      M('regs','Above 10,000 ft MSL (and more than 1,200 ft AGL) VFR requires:',['5 SM visibility, 1,000 ft below, 1,000 ft above, 1 SM horizontal','3 SM and 152','1 SM clear of clouds','No minimums'],0,'Higher speeds aloft demand greater visibility and cloud clearance: \"5-111\" above 10,000 MSL.'),\n      M('regs','Special VFR in a surface area requires:',['An ATC clearance, at least 1 SM visibility, and clear of clouds','5 SM visibility','No clearance','Night only'],0,'SVFR lets you operate below basic VFR in a surface area with a clearance; at night the pilot and aircraft must be IFR-capable.'),\n      M('regs','A third-class medical certificate for a pilot under age 40 is valid for:',['60 calendar months','24 months','12 months','Life'],0,'Under 40: 60 months; age 40 and older: 24 months. BasicMed is an alternative for many operations.'),\n      M('regs','To carry passengers, a pilot must have made, in the preceding 90 days:',['3 takeoffs and 3 landings in the same category/class','1 landing','A flight review','An IPC'],0,'Recency requires three takeoffs and landings in the preceding 90 days (to a full stop if in a tailwheel or at night).'),\n      M('regs','Night passenger currency requires 3 takeoffs and landings to a full stop within 90 days during the period from:',['1 hour after sunset to 1 hour before sunrise','Sunset to sunrise','Civil twilight','Anytime at night'],0,'Night currency for carrying passengers uses the \"1 hour after sunset to 1 hour before sunrise\" window, full-stop landings.'),\n      M('regs','A flight review is required every:',['24 calendar months','12 months','6 months','36 months'],0,'A satisfactory flight review (or equivalent) within the previous 24 calendar months is required to act as PIC.'),\n      M('regs','Which aircraft has the right of way over all others?',['An aircraft in distress','A balloon','An airplane','A helicopter'],0,'An aircraft in distress has right of way over all other traffic. Otherwise the least maneuverable generally has priority.'),\n      M('regs','When two aircraft of the same category are converging, right of way belongs to:',['The aircraft to the other\\u2019s right','The faster aircraft','The higher aircraft','The one on the left'],0,'The aircraft on the right has the right of way; the other should give way and avoid passing over/under/ahead.'),\n      M('regs','When two aircraft approach head-on, each pilot should:',['Alter course to the right','Turn left','Climb','Descend'],0,'Head-on or nearly so, both aircraft turn right to pass safely.'),\n      M('regs','When overtaking another aircraft, you must:',['Pass well clear on the right; the aircraft being overtaken has the right of way','Pass on the left','Pass underneath','Cut in front'],0,'The overtaken aircraft has the right of way; alter course to the right to pass.'),\n      M('regs','On final approach, right of way belongs to:',['The lower aircraft, but it must not cut off or overtake another','The faster aircraft','The higher aircraft','The larger aircraft'],0,'Aircraft on final and landing have priority; a lower aircraft has the right of way but cannot take advantage to cut in.'),\n      M('regs','Minimum safe altitude over a congested area is:',['1,000 ft above the highest obstacle within a 2,000 ft horizontal radius','500 ft','2,000 ft always','No minimum'],0,'Over congested areas: 1,000 ft above the highest obstacle within 2,000 ft horizontally.'),\n      M('regs','Over open water or sparsely populated areas, you may not operate closer than:',['500 ft to any person, vessel, vehicle, or structure','1,000 ft','100 ft','2,000 ft'],0,'In sparsely populated areas keep 500 ft from persons, vessels, vehicles, and structures (except for takeoff/landing).'),\n      M('regs','Safety belts must be fastened by each occupant during:',['Taxi, takeoff, and landing','Cruise only','Turbulence only','The entire flight by law'],0,'The PIC must brief occupants; belts (and shoulder harnesses if installed) are required for taxi, takeoff, and landing.'),\n      F('regs','Mode C / ADS-B Out required airspace','Class A, B, and C; above 10,000 ft MSL (except below 2,500 AGL); and within the 30 NM Mode C veil around Class B.'),\n      M('regs','A flashing GREEN light gun signal to an aircraft in flight means:',['Return for landing (to be followed by a steady green)','Cleared to land','Give way','Airport unsafe'],0,'In flight: flashing green = return for landing; on the ground = cleared to taxi.'),\n      M('regs','A steady RED light gun signal to an aircraft in flight means:',['Give way to other aircraft and continue circling','Stop','Cleared to land','Taxi'],0,'Steady red in flight = give way and keep circling; on the ground = stop.'),\n      M('regs','A flashing WHITE light gun signal (on the ground) means:',['Return to your starting point on the airport','Cleared for takeoff','Taxi to the runway','Emergency'],0,'Flashing white applies on the ground: return to your starting point on the airport.'),\n      M('regs','An alternating RED and GREEN light gun signal means:',['Exercise extreme caution','Cleared to land','Taxi','Hold position'],0,'Alternating red/green means exercise extreme caution, in flight or on the ground.'),\n      F('regs','Required documents that must be aboard AND displayed/available','Airworthiness certificate (displayed) and Registration; plus operating limitations (POH/placards) and weight & balance data on board.'),\n\n      // ===== NAV (added) =====\n      M('nav','A VFR sectional chart uses a scale of:',['1:500,000','1:1,000,000','1:250,000','1:24,000'],0,'Sectionals are 1:500,000 (about 8 NM per inch); terminal area charts are more detailed at 1:250,000.'),\n      M('nav','The maximum permissible VOR bearing error using a ground checkpoint is:',['Plus or minus 4 degrees','Plus or minus 10 degrees','Plus or minus 6 degrees','Zero'],0,'Ground checkpoint tolerance is +/-4 deg; an airborne checkpoint allows +/-6 deg. Log the check for IFR use.'),\n      M('nav','When checking a VOR over a VOT, the CDI should center with:',['0 and a FROM, or 180 and a TO indication','090 and TO','Any setting','A full-scale deflection'],0,'A VOT transmits the 360 radial: 0 with FROM or 180 with TO should center the needle (+/-4 deg tolerance).'),\n      M('nav','One degree of latitude equals approximately:',['60 nautical miles','1 nautical mile','100 nautical miles','15 nautical miles'],0,'Because 1 minute of latitude = 1 NM, 1 degree (60 minutes) = 60 NM. Longitude spacing shrinks toward the poles.'),\n      M('nav','Compared with indicated airspeed, true airspeed at altitude is:',['Higher \\u2014 roughly 2% greater per 1,000 ft','Lower','The same','Always zero'],0,'Thinner air makes the airspeed indicator under-read; TAS increases about 2% per 1,000 ft above indicated.'),\n      M('nav','Groundspeed is:',['True airspeed adjusted for the wind (head/tailwind component)','Always equal to TAS','Indicated airspeed','Mach number'],0,'A headwind reduces groundspeed; a tailwind increases it. Crosswinds require a wind correction (crab) angle.'),\n      M('nav','To track a straight ground path in a crosswind you must:',['Crab into the wind (turn the nose toward the wind)','Point straight at the destination','Fly downwind','Reduce speed'],0,'Establishing a wind correction angle into the wind keeps the airplane on the desired ground track.'),\n      F('nav','Compass deviation','Error caused by the aircraft\\u2019s own magnetic fields (radios, metal); the compass correction card shows the values to apply.'),\n      M('nav','VOR radials are always oriented:',['FROM the station, referenced to magnetic north','TO the station','To true north','To the aircraft heading'],0,'A radial is a magnetic bearing from the VOR; the 090 radial lies to the east of the station.'),\n      M('nav','To fly inbound to a VOR on the 090 radial, your inbound course is approximately:',['270 degrees','090 degrees','180 degrees','360 degrees'],0,'You are east of the station on the 090 radial; flying to it means heading west, about 270.'),\n      M('nav','Full-scale deflection of a VOR CDI represents a course error of:',['10 degrees or more (each dot about 2 degrees)','1 degree','45 degrees','90 degrees'],0,'The needle moves about 2 deg per dot; full deflection means you are 10 deg or more off the selected course.'),\n      M('nav','At 120 knots groundspeed you cover:',['2 nautical miles per minute','1 NM per minute','4 NM per minute','120 NM per minute'],0,'Groundspeed in knots divided by 60 gives NM per minute; 120/60 = 2 NM/min \\u2014 handy for quick ETAs.'),\n      F('nav','The 4 Cs when lost','Climb (better visibility/radio range), Communicate, Confess (declare you are lost), Comply with ATC instructions.'),\n      M('nav','On a sectional chart, an airport symbol depicted in BLUE indicates:',['A controlled airport (has a control tower)','A private strip','A closed airport','A seaplane base'],0,'Blue airport symbols have an operating control tower; magenta symbols indicate airports without a tower.'),\n      M('nav','A faded magenta shaded ring around an airport on a sectional shows:',['Class E airspace beginning at 700 ft AGL','A prohibited area','Class B','A VOR'],0,'Faded magenta = Class E floor at 700 AGL; faded blue = Class E floor at 1,200 AGL.'),\n      M('nav','The large blue number in a quadrant on a sectional (the MEF) shows:',['Maximum Elevation Figure \\u2014 the highest terrain/obstacle in that quadrant','Magnetic variation','Runway length','Frequency'],0,'The MEF is given in thousands and hundreds of feet MSL and helps ensure terrain clearance.'),\n      F('nav','Latitude and longitude','Latitude lines run east-west and measure north/south of the equator; longitude lines run north-south and measure east/west of the prime meridian.'),\n      M('nav','AWOS and ATIS provide:',['Recorded/automated airport weather and information','Traffic clearances','Navigation guidance','Radar service'],0,'ATIS gives current airport info at towered fields; AWOS/ASOS broadcast automated weather observations.'),\n\n      // ===== MEDICAL (added) =====\n      M('medical','Hypoxia caused by carbon monoxide binding to the blood is classified as:',['Hypemic hypoxia','Hypoxic hypoxia','Stagnant hypoxia','Histotoxic hypoxia'],0,'Hypemic = the blood cannot carry enough oxygen (CO, anemia). Hypoxic = low ambient O2 (altitude); histotoxic = cells cannot use O2 (alcohol/drugs).'),\n      M('medical','As altitude increases, the time of useful consciousness:',['Decreases','Increases','Stays constant','Doubles'],0,'At high altitude, a rapid decompression leaves only seconds to minutes of useful consciousness \\u2014 use oxygen promptly.'),\n      M('medical','After scuba diving that required a controlled ascent, you should wait before flying above 8,000 ft:',['24 hours','1 hour','3 hours','No wait'],0,'Wait at least 24 hours after diving requiring controlled ascents (12 hours if not) to avoid decompression sickness.'),\n      M('medical','A sinus or ear block is most likely during:',['Descent','Climb','Cruise','Taxi'],0,'Trapped air cannot equalize as pressure rises on descent; clear the ears (Valsalva/swallow) and avoid flying with a cold.'),\n      M('medical','Autokinesis at night is:',['A stationary light appearing to move when stared at','Loss of night vision','Ear pain','A stall warning'],0,'Fixating on a single light in the dark makes it seem to move; keep the eyes scanning to avoid the illusion.'),\n      F('medical','IMSAFE checklist','Illness, Medication, Stress, Alcohol, Fatigue, Emotion/Eating \\u2014 a personal fitness-for-flight self-assessment.'),\n      M('medical','The five hazardous attitudes are anti-authority, impulsivity, invulnerability, macho, and:',['Resignation','Confidence','Curiosity','Patience'],0,'Each has an antidote (e.g., anti-authority: \"Follow the rules.\" Invulnerability: \"It could happen to me.\").'),\n      M('medical','The antidote to the \"macho\" hazardous attitude is:',['\"Taking chances is foolish.\"','\"I can do it.\"','\"What is the use?\"','\"Do it quickly.\"'],0,'Macho (\"I can do it\") is countered by \"Taking chances is foolish.\" Learning the antidotes is a knowledge-test staple.'),\n      M('medical','Approaching a wider-than-usual runway can create the illusion that you are:',['Higher than actual, tempting a low approach','Lower than actual','Too fast','Off center'],0,'A wide runway looks closer/lower, so pilots may fly a lower approach; a narrow runway causes the opposite (high) illusion.'),\n      M('medical','A \"black hole\" approach over dark, featureless terrain tends to make pilots:',['Fly a lower-than-safe approach','Fly too high','Land long','Overspeed'],0,'Lack of visual cues over water or unlit terrain leads to dangerously low approaches; use the VASI/PAPI and instruments.'),\n      M('medical','The Coriolis illusion is caused by:',['Moving the head during a prolonged constant-rate turn','Bright sunlight','Low blood sugar','Engine noise'],0,'A sudden head movement in a turn can create an overwhelming false sensation of rotation \\u2014 avoid abrupt head motion in IMC.'),\n      M('medical','A \"graveyard spiral\" can result when a pilot:',['Recovers from a spiral but re-enters it because the turn no longer feels present','Climbs too fast','Descends straight ahead','Uses too much rudder'],0,'After a prolonged turn, level flight can feel like a turn the other way; trusting sensations instead of instruments deepens the spiral.'),\n      M('medical','Empty-field myopia at high altitude or at night causes the eyes to:',['Focus only a few feet ahead, making distant traffic hard to see','Focus at infinity','See better','Tear up'],0,'With nothing to focus on, the eyes relax to a near point; deliberately focus on a distant object to detect traffic.'),\n      M('medical','Early symptoms of carbon monoxide poisoning include:',['Headache, drowsiness, and dizziness','Sharp chest pain','Improved vision','Loss of hearing'],0,'CO is odorless; a headache with cabin heat on is a red flag \\u2014 shut off heat, open vents, use oxygen, and land.'),\n      F('medical','The DECIDE model','Detect, Estimate, Choose, Identify, Do, Evaluate \\u2014 a continuous-loop aeronautical decision-making process.'),\n      M('medical','Fatigue in a pilot commonly causes:',['Degraded judgment, slower reactions, and fixation','Improved focus','Better vision','Faster reflexes'],0,'Both acute and chronic fatigue impair performance much like alcohol; rest is the only real remedy.'),\n      M('medical','The \"leans\" is:',['A false sensation of banking, often after a slow roll back to level','A stall warning','A fuel imbalance','A radio failure'],0,'A slow, unnoticed bank followed by a quick correction can leave a strong but false sense of banking the other way \\u2014 believe the attitude indicator.'),\n\n      // ===== FIGURES (instrument reading) =====\n      G('figures',{kind:'alt',alt:4500},'What altitude does this altimeter indicate?',['450 ft','4,500 ft','5,400 ft','45,000 ft'],1,'Long (hundreds) hand on 5 = 500 ft; short (thousands) hand between 4 and 5 = 4,000 ft; the small pointer is just past 0. Reads 4,500 ft.'),\n      G('figures',{kind:'alt',alt:10500},'What altitude does this altimeter indicate?',['1,500 ft','10,500 ft','15,000 ft','5,100 ft'],1,'Hundreds hand on 5 (500), thousands hand near 0 (10,000), and the ten-thousands pointer past 1 = 10,500 ft.'),\n      G('figures',{kind:'alt',alt:2800},'What altitude does this altimeter indicate?',['280 ft','2,800 ft','8,200 ft','28,000 ft'],1,'Hundreds hand on 8 (800) and thousands hand between 2 and 3 = 2,800 ft.'),\n      G('figures',{kind:'asi',kt:100},'Approximately what airspeed is indicated?',['60 knots','80 knots','100 knots','130 knots'],2,'The needle points to 100 on the dial \\u2014 in the green (normal operating) arc.'),\n      G('figures',{kind:'asi',kt:100},'The needle is within the GREEN arc. This represents the:',['Normal operating range (Vs1 to Vno)','Flap operating range','Caution range','Never-exceed speed'],0,'The green arc runs from the power-off clean stall speed (Vs1) up to the maximum structural cruising speed (Vno).'),\n      G('figures',{kind:'asi',kt:150},'The needle is in the YELLOW arc. This means you should:',['Operate only in smooth air with caution','Deploy flaps','Slow to stall speed','Ignore it'],0,'The yellow arc (Vno to Vne) is the caution range \\u2014 fly there only in smooth air, never in turbulence.'),\n      G('figures',{kind:'asi',kt:160},'The needle is at the RED line. This speed is the:',['Never-exceed speed (Vne)','Stall speed','Best glide','Rotation speed'],0,'The red radial line marks Vne \\u2014 exceeding it risks structural failure and must be avoided.'),\n      G('figures',{kind:'hi',hdg:270},'What magnetic heading is the aircraft flying?',['North (360)','East (090)','South (180)','West (270)'],3,'The number under the top lubber line is W (270 degrees) \\u2014 the aircraft is heading west.'),\n      G('figures',{kind:'hi',hdg:45},'What heading is indicated?',['315 (NW)','045 (NE)','135 (SE)','225 (SW)'],1,'The lubber line sits between N and E at 45 \\u2014 a northeast heading.'),\n      G('figures',{kind:'hi',hdg:135},'What heading is indicated?',['135 (SE)','045 (NE)','225 (SW)','315 (NW)'],0,'The heading under the index is between E and S at about 135 \\u2014 southeast.'),\n      G('figures',{kind:'vor',obs:360,side:'R',dots:2,flag:'TO'},'With OBS 360, a TO flag, and the CDI deflected to the RIGHT, the aircraft is:',['Left of the selected course \\u2014 fly right to intercept','Right of course \\u2014 fly left','On course','Past the station'],0,'\"Fly to the needle\": a right deflection means the course is to your right, so you are left of it and correct to the right.'),\n      G('figures',{kind:'vor',obs:360,side:'L',dots:1,flag:'FROM'},'A FROM indication tells you the aircraft is:',['On a radial heading away from the station','Approaching the station','Directly overhead','Off the airway'],0,'FROM means the selected course would take you away from the VOR; TO means toward it.'),\n      G('figures',{kind:'vor',obs:360,side:'R',dots:0,flag:'TO'},'A centered CDI needle with a TO flag means the aircraft is:',['On the selected course, inbound to the station','Off course to the right','Off course to the left','Past the station'],0,'A centered needle means you are on the selected course; the TO flag confirms you are tracking toward the VOR.'),\n      G('figures',{kind:'att',bank:20,pitch:8},'The attitude indicator shows the aircraft in a:',['Climbing right turn','Descending left turn','Straight-and-level attitude','Wings-level climb'],0,'The miniature airplane is above the horizon (nose up) and banked right \\u2014 a climbing right turn.'),\n      G('figures',{kind:'att',bank:-25,pitch:-6},'The attitude indicator shows the aircraft in a:',['Descending left turn','Climbing right turn','Level flight','Steep climb'],0,'The nose is below the horizon (descending) and the aircraft is banked left \\u2014 a descending left turn.'),\n      G('figures',{kind:'att',bank:0,pitch:0},'This attitude indicator shows the aircraft:',['In straight-and-level flight','In a right turn','Climbing','Descending'],0,'The wings are level with the horizon and the miniature airplane is on the horizon line \\u2014 straight and level.'),\n      G('figures',{kind:'att',bank:45,pitch:2},'The attitude indicator shows approximately a:',['45-degree right bank','Level attitude','10-degree left bank','Wings-level descent'],0,'The bank pointer is at the 45-degree index to the right \\u2014 a steep right bank.'),\n\n      // ===== MORE (added batch) =====\n      M('aero','Torque effect (the airplane rolling opposite the propeller) is a result of:',[\"Newton's third law reacting to the spinning propeller\",\"Bernoulli's principle\",\"Ground effect\",\"Adverse yaw\"],0,'The engine turns the prop clockwise (from the cockpit), so the airframe tends to roll left \\u2014 one of the four left-turning tendencies.'),\n      M('aero','A stall can occur:',['At any airspeed, any attitude, any power setting','Only at low airspeed','Only in a nose-high attitude','Only with power off'],0,'Because a stall depends solely on exceeding the critical AOA, it can happen at high speed in a steep turn (accelerated stall).'),\n      F('aero','Center of pressure','The point on the wing where the total aerodynamic lift force is considered to act; it moves with changes in angle of attack.'),\n      M('aero','Flaps generally:',['Increase lift and drag, allowing a slower, steeper approach','Only reduce drag','Increase cruise speed','Raise the stall speed'],0,'Extending flaps lets you fly a slower approach with a steeper path and better visibility over the nose.'),\n      M('systems','A discharge shown on the ammeter in flight usually means:',['The alternator is not keeping up \\u2014 the battery is supplying the load','Normal charging','Full fuel','Low oil'],0,'A persistent discharge points to an alternator/charging problem; reduce electrical load and troubleshoot.'),\n      M('systems','Primer or excessive priming before start can cause:',['A flooded engine or fire risk','Better fuel economy','Higher oil pressure','Nothing'],0,'Over-priming floods the cylinders and can cause an induction fire on start \\u2014 follow the checklist.'),\n      F('systems','Vertical speed indicator (VSI)','A static-only instrument showing rate of climb or descent in feet per minute; it lags a few seconds behind actual pitch changes.'),\n      M('systems','The pitot heat system is used to:',['Prevent ice from blocking the pitot tube','Warm the cabin','De-ice the wings','Heat the oil'],0,'Pitot heat keeps the ram-air inlet clear so the airspeed indicator stays accurate in icing or visible moisture.'),\n      M('weather','The heaviest icing conditions in a cloud are usually found:',['Just above the freezing level where supercooled water is present','Well below freezing','At the cloud base only','In clear air'],0,'Supercooled liquid droplets near and just above the freezing level freeze on contact \\u2014 the classic structural-icing zone.'),\n      M('weather','Fronts are boundaries between:',['Two air masses of different temperature/moisture','High and low terrain','Day and night','Two runways'],0,'Weather changes (wind shift, pressure/temperature change, clouds) typically occur along frontal boundaries.'),\n      F('weather','Virga','Precipitation that evaporates before reaching the ground \\u2014 often associated with strong, gusty downdrafts.'),\n      M('weather','A trough of low pressure is generally associated with:',['Clouds and unsettled weather','Clear skies','Smooth air always','No wind'],0,'Low pressure and troughs favor rising air, clouds, and precipitation, while high pressure/ridges bring fairer weather.'),\n      M('regs','A private pilot may:',['Not act as PIC for compensation or hire (with limited cost-sharing exceptions)','Fly for an airline','Charge passengers full fare','Give flight instruction'],0,'Private pilots fly for pleasure/business without pay; they may share operating expenses pro rata with passengers.'),\n      M('regs','Preflight, an aircraft is airworthy when:',['It conforms to its type certificate and is in condition for safe operation','It has fuel only','The pilot is current','It is clean'],0,'Both conditions must be met; the PIC is responsible for determining the aircraft is airworthy before every flight.'),\n      M('regs','Required inspections for a typical VFR airplane include an annual inspection every 12 months and, if operated for hire, a:',['100-hour inspection','50-hour inspection','5-year inspection','Weekly inspection'],0,'The 100-hour inspection is required when the aircraft is operated for hire or for flight instruction for hire.'),\n      F('regs','VFR fuel reserves','Day VFR: enough to reach the destination plus 30 minutes at normal cruise. Night VFR: destination plus 45 minutes.'),\n      M('regs','An ELT (emergency locator transmitter) battery must be replaced when:',['The transmitter has been used more than 1 cumulative hour or is at 50% of useful life','Every flight','Every annual','Never'],0,'ELT batteries are replaced after 1 cumulative hour of use or at half their useful life, whichever comes first.'),\n      M('nav','A prohibited area on a chart is airspace where:',['Flight is not allowed','Flight is allowed with permission','Military training occurs','Gliders operate'],0,'Prohibited areas (e.g., over the White House) forbid flight; restricted areas may be entered only with permission when not active.'),\n      M('nav','An MOA (Military Operations Area) means a VFR pilot should:',['Exercise extreme caution when military activity is active; VFR flight is permitted','Never enter','Get a clearance','Squawk 7700'],0,'VFR aircraft may transit an active MOA but should use caution and contact the controlling agency for traffic advisories.'),\n      F('nav','Great circle route','The shortest distance between two points on the globe; on many charts it appears as a curved line.'),\n      M('nav','The primary purpose of the pitot-static and gyro instruments together is to allow:',['Controlled flight without outside visual references','Faster cruise','Fuel savings','Radio navigation only'],0,'The flight instruments let a pilot control attitude, heading, altitude, and speed when the horizon is not visible.'),\n      M('medical','Before a flight, the personal minimums a pilot sets should be:',['Established in advance and not lowered under pressure','Ignored if in a hurry','Set by passengers','The legal minimums only'],0,'Predetermined personal minimums guard against get-there-itis; do not relax them because of external pressure.'),\n      M('medical','Vision is most affected at night, so pilots should:',['Allow ~30 minutes for dark adaptation and avoid bright white lights','Stare at instruments','Use high-beam landing lights continuously','Fly faster'],0,'Rod cells need about 30 minutes to adapt; use red or dim lighting in the cockpit to preserve night vision.'),\n      F('medical','Get-there-itis','The hazardous tendency to continue toward a goal (destination) despite deteriorating conditions \\u2014 a common accident chain factor.'),\n    ];\n    return raw.map((it, i) => ({ ...it, id: it.topic + '_' + i }));\n  }\n\n  // ---------- figure rendering (instrument gauges) ----------\n  renderFigure(fig) {\n    const c = React.createElement;\n    const cx = 120, cy = 120;\n    const P = (r, a) => { const t = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };\n    const line = (r1, r2, a, w, col, key) => { const [x1,y1] = P(r1,a), [x2,y2] = P(r2,a); return c('line',{key,x1,y1,x2,y2,stroke:col,strokeWidth:w,strokeLinecap:'round'}); };\n    const txt = (x, y, s, size, col, key) => c('text',{key,x,y,fill:col,fontSize:size,fontWeight:700,textAnchor:'middle',dominantBaseline:'central',fontFamily:'Bricolage Grotesque, sans-serif'}, s);\n    const arc = (r, a1, a2, col, w, key) => { const [x1,y1] = P(r,a1), [x2,y2] = P(r,a2); const large = ((a2-a1)%360+360)%360 > 180 ? 1 : 0; return c('path',{key,d:`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`,fill:'none',stroke:col,strokeWidth:w}); };\n    const face = (bg) => c('circle',{key:'face',cx,cy,r:112,fill:bg||'#12161c',stroke:'#2b3442',strokeWidth:6});\n    const hub = c('circle',{key:'hub',cx,cy,r:9,fill:'#eef2f7'});\n    let kids = [];\n\n    if (fig.kind === 'alt') {\n      kids.push(face());\n      for (let i=0;i<50;i++){ const a=i*7.2, lng=i%5===0; kids.push(line(lng?92:99,105,a,lng?3:1.5,'#aeb8c6','t'+i)); }\n      for (let n=0;n<10;n++){ const [x,y]=P(74,n*36); kids.push(txt(x,y,String(n),20,'#eef2f7','n'+n)); }\n      const alt=fig.alt;\n      kids.push(line(-16,98,(alt/10000%10)*36,3,'#8fb4f0','h10'));\n      kids.push(line(-12,52,(alt/1000%10)*36,11,'#eef2f7','h1'));\n      kids.push(line(-16,92,(alt/100%10)*36,5,'#eef2f7','h100'));\n      kids.push(hub);\n    } else if (fig.kind === 'asi') {\n      kids.push(face());\n      const minK=40,maxK=160,a0=-135,span=270;\n      const AF = k => a0 + (Math.max(minK,Math.min(maxK,k))-minK)/(maxK-minK)*span;\n      kids.push(arc(96,AF(40),AF(85),'#eef2f7',6,'wa'));\n      kids.push(arc(88,AF(48),AF(129),'#33b06a',7,'ga'));\n      kids.push(arc(88,AF(129),AF(158),'#e7b83b',7,'ya'));\n      kids.push(line(80,101,AF(160),4,'#e4574c','rl'));\n      for (let k=40;k<=160;k+=20){ const [x,y]=P(66,AF(k)); kids.push(txt(x,y,String(k),15,'#eef2f7','k'+k)); kids.push(line(102,112,AF(k),2,'#aeb8c6','kt'+k)); }\n      kids.push(txt(cx,cy+42,'KNOTS',11,'#7f8b9a','kn'));\n      kids.push(line(-14,90,AF(fig.kt),4,'#eef2f7','nd'));\n      kids.push(hub);\n    } else if (fig.kind === 'hi') {\n      kids.push(face());\n      const gk=[];\n      for (let h=0;h<360;h+=5){ const [x1,y1]=P(h%10===0?94:100,h),[x2,y2]=P(108,h); gk.push(c('line',{key:'g'+h,x1,y1,x2,y2,stroke:'#aeb8c6',strokeWidth:h%10===0?2:1})); }\n      for (let h=0;h<360;h+=30){ const lbl={0:'N',90:'E',180:'S',270:'W'}[h]||String(h/10); const [x,y]=P(76,h); gk.push(txt(x,y,lbl,h%90===0?20:15,'#eef2f7','l'+h)); }\n      kids.push(c('g',{key:'card',transform:`rotate(${-fig.hdg} ${cx} ${cy})`},gk));\n      kids.push(c('polygon',{key:'lub',points:`${cx-8},10 ${cx+8},10 ${cx},24`,fill:'#e7b83b'}));\n      kids.push(c('line',{key:'w1',x1:cx,y1:cy-24,x2:cx,y2:cy+24,stroke:'#e7b83b',strokeWidth:4}));\n      kids.push(c('line',{key:'w2',x1:cx-22,y1:cy,x2:cx+22,y2:cy,stroke:'#e7b83b',strokeWidth:4}));\
